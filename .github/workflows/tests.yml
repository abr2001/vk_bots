name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby -Itests tests/test_unu_client.rb
      - run: ruby -Itests tests/test_vkserfing_client.rb
      - run: ruby -Itests tests/test_vkserfing_watcher_bot.rb
      - run: ruby -Itests tests/test_unu_autoapprove.rb
