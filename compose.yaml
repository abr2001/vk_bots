services:
  watcher:
    build: .
    container_name: vk-watcher-bot
    restart: unless-stopped
    environment:
      # offset-файл хранится в named volume, переживает пересоздание контейнера
      VKS_WATCHER_OFFSET_FILE: /data/.vks_watcher_offset
      # дедуп-список обработанных ссылок тоже в volume
      VKS_WATCHER_SEEN_LINKS_FILE: /data/.vks_watcher_seen_links
    volumes:
      # .env монтируется read-only: ключ UNU содержит дефис в имени,
      # через env_file такие переменные compose не передаёт
      - ./.env:/app/.env:ro
      - watcher-data:/data

  autoapprove:
    build: .
    container_name: vk-unu-autoapprove
    restart: unless-stopped
    command: ["ruby", "bots/unu_autoapprove.rb"]
    environment:
      TASK_LINKS_FILE: /data/task_links.json
    volumes:
      - ./.env:/app/.env:ro
      - watcher-data:/data

volumes:
  watcher-data:
